title: NBA 正在发生
description: 美媒 NBA 动态全自动追更，每小时更新（如果有新闻）。

url: "https://cibstan1999.github.io"
baseurl: "/NBA-Quick-News-2.0"

timezone: Asia/Shanghai
future: true

theme: minima

lang: zh-CN
show_excerpts: true

# 顶部导航仅保留首页，避免把内部工作文档暴露为导航入口。
header_pages:
  - index.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - logs/rejections
  - editorial/templates
  - configs
  - logs/codex-runs
