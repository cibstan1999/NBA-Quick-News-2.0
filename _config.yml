title: NBA 正在发生
description: 美媒 NBA 动态全自动追更，每小时更新（如果有新闻）。

url: "https://cibstan1999.github.io"
baseurl: "/NBA-Quick-News-2.0"

timezone: Asia/Shanghai
future: true

theme: minima

lang: zh-CN
show_excerpts: true

# 顶部导航仅保留首页，避免把内部工作文档暴露为导航入口。
header_pages:
  - index.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# 这些目录只服务于采集、编辑、审计和自动化，不进入公开网站。
exclude:
  - README.md
  - LICENSE
  - AGENTS.md
  - .github
  - GAS
  - configs
  - docs
  - editorial
  - scripts
  - sources/inbox
  - sources/needs-review
  - logs/rejections
  - logs/codex-runs
