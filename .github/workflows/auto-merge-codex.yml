name: Auto Merge Codex PR

on:
  workflow_run:
    workflows:
      - Editorial PR Validation
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge validated Codex PR
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify and merge trusted Codex PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let prNumber = run.pull_requests?.[0]?.number;

            if (!prNumber && run.head_branch) {
              const candidates = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                base: 'main',
                head: `${owner}:${run.head_branch}`
              });
              prNumber = candidates.data[0]?.number;
            }

            if (!prNumber) {
              core.notice('没有找到与本次校验对应的开放 PR，跳过。');
              return;
            }

            let { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            const trusted =
              pr.state === 'open' &&
              pr.base.ref === 'main' &&
              pr.head.repo?.full_name === `${owner}/${repo}` &&
              pr.head.ref.startsWith('codex/inbox-') &&
              pr.user?.login === owner;

            if (!trusted) {
              core.notice(`PR #${prNumber} 不符合自动合并安全条件，保留人工处理。`);
              return;
            }

            if (pr.draft) {
              await github.graphql(
                `mutation($id: ID!) {
                  markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                    pullRequest { number isDraft }
                  }
                }`,
                { id: pr.node_id }
              );
              core.info(`PR #${prNumber} 已从 Draft 转为 Ready for review。`);
              await sleep(2000);
            }

            let merged = false;
            let mergeSha = '';

            for (let attempt = 1; attempt <= 8; attempt++) {
              ({ data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              }));

              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                core.setFailed(`PR #${prNumber} 存在冲突，无法自动合并。`);
                return;
              }

              try {
                const result = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${prNumber})`
                });

                if (result.data.merged) {
                  merged = true;
                  mergeSha = result.data.sha || '';
                  break;
                }
              } catch (error) {
                if (![405, 409].includes(error.status) || attempt === 8) throw error;
              }

              core.info(`PR #${prNumber} 暂不可合并，等待状态刷新（${attempt}/8）。`);
              await sleep(3000);
            }

            if (!merged) {
              core.setFailed(`PR #${prNumber} 校验通过，但自动合并未成功。`);
              return;
            }

            core.info(`PR #${prNumber} 已自动合并，SHA=${mergeSha}`);

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${pr.head.ref}`
              });
              core.info(`已删除分支 ${pr.head.ref}`);
            } catch (error) {
              core.warning(`删除分支失败，不影响发布：${error.message}`);
            }

            // GITHUB_TOKEN 产生的合并事件通常不会再次触发 push 工作流，
            // 因此显式启动 Pages Workflow。
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'pages.yml',
              ref: 'main'
            });
            core.info('已启动 Deploy GitHub Pages。');
