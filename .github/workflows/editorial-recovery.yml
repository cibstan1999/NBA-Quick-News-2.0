name: Editorial Recovery Watchdog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: editorial-recovery-watchdog
  cancel-in-progress: false

jobs:
  recover:
    name: Recover stalled Codex PRs
    runs-on: ubuntu-latest

    steps:
      - name: Scan and restart stalled editorial validation
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = Date.now();
            const normalGraceMs = 10 * 60 * 1000;
            const successfulButOpenGraceMs = 5 * 60 * 1000;
            const infrastructureFailureMs = 8 * 60 * 1000;
            const activeStatuses = new Set([
              'queued',
              'in_progress',
              'waiting',
              'pending',
              'requested'
            ]);
            const retryableConclusions = new Set([
              'cancelled',
              'timed_out',
              'stale',
              'action_required',
              'startup_failure'
            ]);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });

            const candidates = pulls
              .filter((pr) => pr.head.ref.startsWith('codex/inbox-'))
              .filter((pr) => pr.head.repo?.full_name === `${owner}/${repo}`)
              .filter((pr) => pr.user?.login === owner)
              .filter((pr) => now - new Date(pr.created_at).getTime() >= normalGraceMs)
              .slice(0, 10);

            if (!candidates.length) {
              core.info('没有需要恢复的 Codex 编辑 PR。');
              return;
            }

            for (const pr of candidates) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'editorial-pr-validation.yml',
                branch: pr.head.ref,
                per_page: 20
              });

              const current = runs.data.workflow_runs.find(
                (run) => run.head_sha === pr.head.sha
              );

              if (current && activeStatuses.has(current.status)) {
                core.info(`PR #${pr.number} 的校验仍在运行，跳过。`);
                continue;
              }

              let shouldDispatch = false;
              let reason = '';

              if (!current) {
                shouldDispatch = true;
                reason = '当前 head SHA 没有校验记录';
              } else if (current.conclusion === 'success') {
                const successAge = now - new Date(current.updated_at).getTime();
                if (successAge >= successfulButOpenGraceMs) {
                  shouldDispatch = true;
                  reason = '校验已成功但 PR 仍未自动合并';
                }
              } else if (retryableConclusions.has(current.conclusion)) {
                shouldDispatch = true;
                reason = `上次校验为 ${current.conclusion}`;
              } else if (current.conclusion === 'failure') {
                const startedAt = new Date(
                  current.run_started_at || current.created_at
                ).getTime();
                const endedAt = new Date(
                  current.updated_at || current.created_at
                ).getTime();
                const duration = endedAt - startedAt;

                if (duration >= infrastructureFailureMs) {
                  shouldDispatch = true;
                  reason = '上次校验长时间运行后失败，按基础设施故障恢复';
                } else {
                  core.warning(
                    `PR #${pr.number} 快速校验失败，视为内容问题，不自动重试。`
                  );
                }
              }

              if (!shouldDispatch) continue;

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'editorial-pr-validation.yml',
                  ref: pr.head.ref,
                  inputs: {
                    pr_number: String(pr.number)
                  }
                });
                core.notice(`已恢复 PR #${pr.number}：${reason}`);
              } catch (error) {
                core.warning(
                  `恢复 PR #${pr.number} 失败，等待下一轮：${error.message}`
                );
              }
            }
